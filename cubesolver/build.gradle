plugins {
    // Apply the Java plugin to add support for Java
    id 'java'
    // Apply the application plugin to make it easy to run the app
    id 'application'
}

repositories {
    // Use Maven Central for resolving dependencies
    mavenCentral()
}

dependencies {
    // Add any external libraries your cube solver needs here
    // Example: implementation 'com.google.gson:gson:2.10.1'

    // Use JUnit Jupiter for testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    // Define the main class for the application
    // REPLACE 'com.example.Main' WITH YOUR ACTUAL MAIN CLASS NAME
    mainClass = 'com.example.Main'
}

tasks.named('test') {
    // Use JUnit Platform for unit tests
    useJUnitPlatform()
}
